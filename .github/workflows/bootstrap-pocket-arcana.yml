name: Bootstrap Pocket Arcana

on:
  push:
    paths:
      - '.github/workflows/bootstrap-pocket-arcana.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Pocket Arcana project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/chunk00.b64 \
            .bootstrap/chunk01.b64 \
            .bootstrap/rest00.b64 \
            .bootstrap/rest01.b64 \
            .bootstrap/rest02.b64 \
            .bootstrap/rest03.b64 \
            .bootstrap/rest04.b64 \
            > /tmp/pocket_arcana.b64

          base64 --decode /tmp/pocket_arcana.b64 > /tmp/pocket_arcana.tar.xz
          tar -xJf /tmp/pocket_arcana.tar.xz -C .

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-pocket-arcana.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "Pocket Arcana Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import Pocket Arcana v0.4 Opus handoff"
          git push origin HEAD:main
